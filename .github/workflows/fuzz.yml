name: Fuzz

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_lexer, fuzz_parser, fuzz_format, fuzz_minify]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-fuzz

      - name: Seed the corpus from the fixtures
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          find tests/fixtures -name '*.lua' -o -name '*.luau' | while read -r fixture; do
            cp "$fixture" "fuzz/corpus/$TARGET/$(echo "$fixture" | md5sum | cut -d ' ' -f 1)"
          done

      - name: Fuzz for 5 minutes
        run: cargo +nightly fuzz run "$TARGET" -- -max_total_time=300 -timeout=30

      - name: Upload the crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-artifacts
          path: fuzz/artifacts/
