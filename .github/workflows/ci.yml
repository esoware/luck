name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only PR runs cancel. Main runs save the cache, so each one gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ready:
    name: Ready on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: windows-2025-vs2026
          - os: macOS
            runner: macos-26
          - os: Linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Run just ready
        run: just ready

      - name: Fail if just ready changed or added a file
        run: git add --all && git diff --cached --exit-code
