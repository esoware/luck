# One bench job per pipeline stage, each built with the codspeed feature and run under CodSpeed, plus the minsize and allocation snapshot checks. Modeled on oxc's benchmark workflow.

name: Benchmark

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths: &paths
      - "crates/**/*.rs"
      - "crates/**/Cargo.toml"
      - "crates/luck_benchmark/**"
      - "crates/luck_benchmark_files/**"
      - "crates/luck_allocs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/benchmark.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Bench ${{ matrix.component }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Authenticates with CodSpeed over OpenID Connect.
    strategy:
      fail-fast: false
      matrix:
        component: [lexer, parser, semantic, linter, codegen, formatter, minifier, bundler]
    env:
      COMPONENT: ${{ matrix.component }}
      # mimalloc purges freed memory on a 10 ms wall-clock timer, so under simulation it would fire at a different point in every run.
      MIMALLOC_PURGE_DELAY: "-1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: benchmark
          save-if: ${{ github.ref_name == 'main' }}

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-codspeed@6.0.0

      # The pins live in benchmark_files.rs and the cache layout in download.rs, so keying on both refetches only when one changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/luck_benchmark_files/cache
          key: benchmark-files-${{ hashFiles('crates/luck_benchmark_files/src/benchmark_files.rs', 'crates/luck_benchmark_files/src/download.rs') }}

      - name: Build the benchmark
        run: cargo codspeed build -p luck_benchmark --bench "$COMPONENT" --features codspeed

      - name: Run the benchmark
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        timeout-minutes: 30
        with:
          mode: simulation
          run: cargo codspeed run ${{ matrix.component }}

  minsize:
    name: Minsize snapshot
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: minsize
          save-if: ${{ github.ref_name == 'main' }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/luck_benchmark_files/cache
          key: benchmark-files-${{ hashFiles('crates/luck_benchmark_files/src/benchmark_files.rs', 'crates/luck_benchmark_files/src/download.rs') }}

      - name: Check that minsize.snap is current
        run: cargo test -p luck_benchmark --test it minsize_is_up_to_date -- --ignored

  allocs:
    name: Allocation snapshots
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: allocs
          save-if: ${{ github.ref_name == 'main' }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/luck_benchmark_files/cache
          key: benchmark-files-${{ hashFiles('crates/luck_benchmark_files/src/benchmark_files.rs', 'crates/luck_benchmark_files/src/download.rs') }}

      - name: Check that the allocation snapshots are current
        run: |
          cargo run -p luck_allocs --profile allocs
          git diff --exit-code crates/luck_allocs ||
            (echo 'The allocation snapshots are stale. Run `just allocs` and commit what it writes, or fix the regression.' && exit 1)
