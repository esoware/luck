name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Open the release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Holds the release token, and only main can deploy to it.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: git-cliff@2.14.2

      - name: Bump the version and write the release notes
        id: bump
        run: |
          current=$(grep -m 1 '^version' Cargo.toml | cut -d '"' -f 2)
          next=$(git cliff --bumped-version)
          next=${next#v}
          if [ "$next" = "$current" ]; then
            echo "::error::Nothing to bump. Either no commit since the last tag calls for a release, or Cargo.toml is already at $next and the Release workflow hasn't published it."
            exit 1
          fi
          sed -i -E "s/^(version += )\"$current\"/\1\"$next\"/; s/^(luck[a-z_]* += \{ version = )\"$current\"/\1\"$next\"/" Cargo.toml
          cargo update --workspace
          npm version "$next" --no-git-tag-version --prefix editors/vscode
          git cliff --unreleased --strip all --output "$RUNNER_TEMP/notes.md"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      # A PR that GITHUB_TOKEN opens or pushes to starts no workflow, so CI would never run on
      # it. A personal access token's push and PR do.
      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          title="build(repo,vscode): release $VERSION"
          git switch --create release
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --all --quiet --message "$title"
          gh auth setup-git
          git push --force origin release
          if [ "$(gh pr list --head release --json number --jq length)" = 0 ]; then
            gh pr create --base main --head release --title "$title" --body-file "$RUNNER_TEMP/notes.md"
          else
            gh pr edit release --title "$title" --body-file "$RUNNER_TEMP/notes.md"
          fi
