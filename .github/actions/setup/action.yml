name: Setup
description: Install the extension's packages, the pinned Rust toolchain, and cargo tools.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: editors/vscode/package-lock.json

    - name: Install the extension's packages
      shell: bash
      run: npm ci --prefix editors/vscode

    # rust-cache keys on every installed toolchain, and runner images ship different stable ones,
    # so we uninstall all but the pinned one.
    - name: Install the Rust toolchain
      shell: bash
      run: |
        rustup toolchain install
        pinned=$(rustup show active-toolchain | cut -d ' ' -f 1)
        for toolchain in $(rustup toolchain list --quiet); do
          if [ "$toolchain" != "$pinned" ]; then
            rustup toolchain uninstall "$toolchain"
          fi
        done

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: just@1.59.0,cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-shear@1.14.0,zizmor@1.32.0
