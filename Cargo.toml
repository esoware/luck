[workspace]
members  = ["crates/*"]
resolver = "2"

[workspace.package]
version      = "0.6.0"
authors      = ["Esoware"]
categories   = ["compilers", "command-line-utilities"]
description  = "Lua 5.1-5.5 and Luau parser, formatter, linter, bundler, and minifier"
edition      = "2024"
homepage     = "https://github.com/esoware/luck"
keywords     = ["lua", "luau", "bundler", "minifier", "parser"]
license      = "MIT"
repository   = "https://github.com/esoware/luck"
rust-version = "1.91"

[workspace.dependencies]
luck_allocator       = { version = "0.6.0", path = "crates/luck_allocator" }
luck_ast             = { version = "0.6.0", path = "crates/luck_ast" }
luck_ast_macros      = { version = "0.6.0", path = "crates/luck_ast_macros" }
luck_benchmark_files = { path = "crates/luck_benchmark_files" }
luck_bundler         = { version = "0.6.0", path = "crates/luck_bundler" }
luck_codegen         = { version = "0.6.0", path = "crates/luck_codegen" }
luck_config          = { version = "0.6.0", path = "crates/luck_config" }
luck_data_structures = { version = "0.6.0", path = "crates/luck_data_structures" }
luck_diagnostics     = { version = "0.6.0", path = "crates/luck_diagnostics" }
luck_formatter       = { version = "0.6.0", path = "crates/luck_formatter" }
luck_lexer           = { version = "0.6.0", path = "crates/luck_lexer" }
luck_linter          = { version = "0.6.0", path = "crates/luck_linter" }
luck_lsp             = { version = "0.6.0", path = "crates/luck_lsp" }
luck_minifier        = { version = "0.6.0", path = "crates/luck_minifier" }
luck_parser          = { version = "0.6.0", path = "crates/luck_parser" }
luck_resolver        = { version = "0.6.0", path = "crates/luck_resolver" }
luck_semantic        = { version = "0.6.0", path = "crates/luck_semantic" }
luck_stdlib          = { version = "0.6.0", path = "crates/luck_stdlib" }
luck_testgen         = { path = "crates/luck_testgen" }
luck_token           = { version = "0.6.0", path = "crates/luck_token" }
luck_value           = { version = "0.6.0", path = "crates/luck_value" }

ariadne               = "0.6"
assert_cmd            = "2"
bitflags              = "2"
clap                  = { version = "4", features = ["derive"] }
criterion2            = { version = "3", default-features = false }
crossbeam-channel     = "0.5"
flate2                = "1"
globset               = { version = "0.4", default-features = false }
hashbrown             = { version = "0.17", default-features = false, features = ["inline-more"] }
humansize             = "2"
ignore                = "0.4"
insta                 = "1"
json5                 = "1.3"
ls-types              = "0.0.6"
lsp-server            = "0.10"
memchr                = "2"
mimalloc-safe         = "0.1.70"
mlua                  = { version = "0.12", features = ["vendored"] }
notify-debouncer-mini = "0.7"
parking_lot           = "0.12"
petgraph              = { version = "0.8", default-features = false, features = ["std"] }
predicates            = { version = "3", default-features = false }
prettyplease          = "0.3"
proc-macro2           = "1"
quickcheck            = { version = "1.1", default-features = false }
quote                 = "1"
rayon                 = "1"
rustc-hash            = "2"
saphyr                = "0.3"
schemars              = "1"
self_cell             = "1.3"
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
similar               = "2"
syn                   = { version = "3", default-features = false, features = ["full", "parsing", "printing"] }
tar                   = "0.4"
tempfile              = "3"
thread_local          = "1.1"
toml                  = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
unicode-width         = { version = "0.2", default-features = false }
ureq                  = "3"

# Full debuginfo makes MSVC linking of the test binaries the slowest part of
# a rebuild. Line tables keep backtraces usable at a fraction of the link cost.
[profile.dev]
debug = "line-tables-only"

# Compile insta and its dependencies in release mode for faster snapshot tests.
# See: https://insta.rs/docs/quickstart/#optional-faster-runs
[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

# The stack tests hold every stage to `luck_ast::MIN_STACK_BYTES` in frames
# close to the ones that ship.
[profile.test]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# For profiling: `cargo build --profile=release-with-debug`.
[profile.release-with-debug]
inherits = "release"
strip = false
debug = true

# For `just allocs`: optimized like a release, without the fat LTO that
# makes every rebuild slow. Allocation counts don't depend on either.
[profile.allocs]
inherits = "release"
lto = false
codegen-units = 256

# For `just conformance`: optimized without the fat LTO, with every debug
# assertion and overflow check on, and with panics that unwind, so a stage
# that panics on one suite file is reported for that file and the run goes on.
[profile.conformance]
inherits = "release"
lto = false
codegen-units = 256
debug-assertions = true
overflow-checks = true
panic = "unwind"

# Every level here is a warning. `just lint` and `cargo doc` turn warnings into
# errors through `build.warnings`, so a build or a test run mid-edit still goes
# through.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }

ambiguous_negative_literals = "warn"
deprecated_in_future = "warn"
ffi_unwind_calls = "warn"
impl_trait_redundant_captures = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
raw_borrows_via_references = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_code = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Third-party dependencies pull in more than one version of syn, hashbrown,
# bitflags, windows-sys, and others.
multiple_crate_versions = "allow"

# `#[must_use]` goes where dropping the result is a bug, not on every pure fn.
must_use_candidate = "allow"
# Every bool struct it flagged here was a set of independent flags.
struct_excessive_bools = "allow"
# Length alone isn't a reason to split a function into single-caller helpers.
too_many_lines = "allow"

# Nursery and restriction lints are opted into one at a time. Each one here
# flags a bug, a performance trap, a confusing construct, or a break from an
# AGENTS.md rule, and its fix is never worse code. Lints that only pick one of
# two equally good spellings, or whose fixes clippy documents as sometimes
# worse, stay off.
as_ptr_cast_mut = "warn"
clear_with_drain = "warn"
coerce_container_to_any = "warn"
collection_is_never_read = "warn"
debug_assert_with_mut_call = "warn"
fallible_impl_from = "warn"
iter_with_drain = "warn"
large_stack_frames = "warn"
literal_string_with_formatting_args = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
needless_type_cast = "warn"
non_send_fields_in_send_ty = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
search_is_some = "warn"
significant_drop_in_scrutinee = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
tuple_array_conversions = "warn"
type_repetition_in_bounds = "warn"
uninhabited_references = "warn"
unnecessary_struct_initialization = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
useless_let_if_seq = "warn"
volatile_composites = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
as_underscore = "warn"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
default_union_representation = "warn"
empty_drop = "warn"
error_impl_error = "warn"
exit = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
map_with_unused_argument_over_ranges = "warn"
min_ident_chars = "warn"
missing_assert_message = "warn"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
multiple_unsafe_ops_per_block = "warn"
non_ascii_literal = "warn"
non_zero_suggestions = "warn"
precedence_bits = "warn"
# The language server speaks its protocol over stdout.
print_stderr = "warn"
print_stdout = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
shadow_unrelated = "warn"
string_lit_chars_any = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_rest_pattern = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"
use_debug = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"
