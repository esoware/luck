avoid-breaking-exported-api = false
allow-mixed-uninlined-format-args = false
upper-case-acronyms-aggressive = true
matches-for-let-else = "AllTypes"
lint-commented-code = true
allow-unwrap-in-tests = true

allowed-idents-below-min-chars = ["..", "a", "b", "c", "e", "f", "k", "v"]

disallowed-names = [
  "..",
  "val", "tmp", "res", "buf", "str", "ctx", "cfg", "conf", "req", "resp", "msg",
  "err", "conn", "addr", "sig", "prev", "len", "idx", "cb", "rx",
  "vs", "dst", "src", "doc", "dir", "dest", "out", "ret", "obj", "arr",
  "num", "cnt", "opt", "opts", "meta", "ws", "fut", "hdr", "cur", "pos", "ch", "evt",
]

disallowed-methods = [
  { path = "f32::mul_add", reason = "constant evaluation rounds the product and the sum separately, as the target does" },
  { path = "f64::mul_add", reason = "constant evaluation rounds the product and the sum separately, as the target does" },
]

disallowed-types = [
  { path = "std::collections::HashMap", reason = "RandomState makes iteration order differ per run; use rustc_hash::FxHashMap" },
  { path = "std::collections::HashSet", reason = "RandomState makes iteration order differ per run; use rustc_hash::FxHashSet" },
  { path = "std::sync::Mutex", reason = "poisoning; use parking_lot::Mutex" },
  { path = "std::sync::RwLock", reason = "poisoning; use parking_lot::RwLock" },
  { path = "std::sync::Condvar", reason = "poisoning; use parking_lot::Condvar" },
]
