[package]
name                   = "luck_lua"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
description.workspace  = true
edition.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

# The `luck` package name is taken on crates.io by an unrelated crate, so the package publishes as `luck_lua` while the library stays `luck`.
[lib]
name = "luck"

[features]
default = []

full = ["codegen", "bundler", "minifier", "formatter", "linter", "type_checker", "config"]

codegen      = ["luck_codegen"]
resolver     = ["luck_resolver"]
bundler      = ["luck_bundler", "resolver", "minifier"]
minifier     = ["luck_minifier"]
formatter    = ["luck_formatter"]
semantic     = ["luck_semantic"]
stdlib       = ["luck_stdlib", "semantic"]
linter       = ["luck_linter", "stdlib"]
type_checker = ["luck_type_checker"]
config       = ["luck_config", "bundler", "minifier", "formatter", "linter"]

[dependencies]
luck_allocator    = { workspace = true }
luck_ast          = { workspace = true }
luck_bundler      = { workspace = true, optional = true }
luck_codegen      = { workspace = true, optional = true }
luck_config       = { workspace = true, optional = true }
luck_diagnostics  = { workspace = true }
luck_formatter    = { workspace = true, optional = true }
luck_lexer        = { workspace = true }
luck_linter       = { workspace = true, optional = true }
luck_minifier     = { workspace = true, optional = true }
luck_parser       = { workspace = true }
luck_resolver     = { workspace = true, optional = true }
luck_semantic     = { workspace = true, optional = true }
luck_stdlib       = { workspace = true, optional = true }
luck_token        = { workspace = true }
luck_type_checker = { workspace = true, optional = true }

[dev-dependencies]
# Every stage's doctest runs.
luck_lua = { path = ".", features = ["full"] }

[package.metadata.docs.rs]
all-features = true
