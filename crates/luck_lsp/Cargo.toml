[package]
name                   = "luck_lsp"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
description            = "Language Server Protocol implementation for Lua and Luau"
edition.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
luck_ast       = { workspace = true }
luck_config    = { workspace = true }
luck_core      = { workspace = true }
luck_formatter = { workspace = true }
luck_lexer     = { workspace = true }
luck_linter    = { workspace = true }
luck_parser    = { workspace = true }
luck_resolver  = { workspace = true }
luck_semantic  = { workspace = true }
luck_token     = { workspace = true }

rustc-hash       = { workspace = true }
serde_json       = { workspace = true }
tokio            = { workspace = true, features = ["io-std", "io-util", "net", "rt", "sync"] }
tower-lsp-server = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["macros", "rt-multi-thread"] }
