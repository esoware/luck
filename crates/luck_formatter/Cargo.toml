[package]
name                   = "luck_formatter"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
description            = "Prettier-style formatter for Lua 5.1-5.5 and Luau"
edition.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[features]
# Derive `Deserialize` for the option enums, the shape `luck.json` gives it.
serde = ["dep:serde"]
# Derive `JsonSchema` too, for the schema `luck_config` generates.
schemars = ["dep:schemars", "serde"]

[lints]
workspace = true

[dependencies]
luck_allocator   = { workspace = true }
luck_ast         = { workspace = true }
luck_diagnostics = { workspace = true }
luck_lexer       = { workspace = true }
luck_parser      = { workspace = true }
luck_token       = { workspace = true }

rustc-hash    = { workspace = true }
schemars      = { workspace = true, optional = true }
serde         = { workspace = true, optional = true }
unicode-width = { workspace = true }

[dev-dependencies]
luck_testgen = { workspace = true }

insta = { workspace = true }
