[package]
name                   = "luck_stdlib"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
description            = "The standard libraries of Luau and Roblox from Luau definition files, a host's definitions layered over one, and what a chunk's names and calls reach in it"
edition.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[features]
# Derive `JsonSchema` for `Variant`, for the schema `luck_config` generates.
schemars = ["dep:schemars"]

[lints]
workspace = true

[dependencies]
luck_allocator   = { workspace = true }
luck_ast         = { workspace = true }
luck_diagnostics = { workspace = true }
luck_parser      = { workspace = true }
luck_semantic    = { workspace = true }

rustc-hash = { workspace = true }
schemars   = { workspace = true, optional = true }
self_cell  = { workspace = true }
serde      = { workspace = true }

[dev-dependencies]
luck_type_checker = { workspace = true }

# Only the ignored regenerate tests use these, to fetch and read the live Roblox API dump, Creator
# Documentation, and Luau library reference.
flate2     = { workspace = true }
saphyr     = { workspace = true }
serde_json = { workspace = true }
tar        = { workspace = true }
ureq       = { workspace = true }
