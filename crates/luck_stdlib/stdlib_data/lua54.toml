# Lua 5.4 standard library, verified against the 5.4 reference manual
# (https://www.lua.org/manual/5.4/). Notable vs 5.3:
#   - bit32 gone entirely (native bitwise operators only)
#   - warn() and coroutine.close added
#   - collectgarbage tuning becomes overloaded forms; setpause/
#     setstepmul options deprecated per manual section 8.2
#   - math.randomseed optional and two-seed; utf8 gains the lax flag;
#     debug.get/setuservalue gain the index argument
#   - to-be-closed locals are parser-level, not stdlib

[globals._G]
kind = "property"
is_read_only = false

[globals._VERSION]
kind = "property"

# Interactive-interpreter prompt overrides (manual section 7).
[globals._PROMPT]
kind = "property"
is_read_only = false

[globals._PROMPT2]
kind = "property"
is_read_only = false

[globals.assert]
kind = "function"
params = [
  { kind = "any" },
  { kind = "string", is_required = false },
  { kind = "vararg" },
]

# 5.4 adds 'generational' and 'incremental' to switch GC mode;
# 'incremental' takes up to three tuning numbers and 'generational' two.
# 'setpause'/'setstepmul' are deprecated per manual section 8.2.
[globals.collectgarbage]
kind = "function"
overloads = [
  { params = [
    { kind = "constant", values = [
      "collect",
      "count",
      "isrunning",
      "restart",
      { value = "setpause", deprecated = { message = "deprecated in Lua 5.4; use collectgarbage('incremental', pause, 0, 0) instead" } },
      { value = "setstepmul", deprecated = { message = "deprecated in Lua 5.4; use collectgarbage('incremental', 0, stepmul, 0) instead" } },
      "step",
      "stop",
    ], is_required = false },
    { kind = "number", is_required = false },
  ] },
  { params = [
    { kind = "constant", values = ["incremental"] },
    { kind = "number", is_required = false },
    { kind = "number", is_required = false },
    { kind = "number", is_required = false },
  ] },
  { params = [
    { kind = "constant", values = ["generational"] },
    { kind = "number", is_required = false },
    { kind = "number", is_required = false },
  ] },
]

[globals.dofile]
kind = "function"
params = [{ kind = "string", is_required = false }]

[globals.error]
kind = "function"
params = [
