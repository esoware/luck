# ---- file handle shape (io.open and friends) ----

# Read formats ("*l", "*n", "*a", or a byte count) stay a plain vararg,
# since a constant set would reject numeric counts.
[shapes.file.members.read]
kind = "function"
is_method = true
params = [{ kind = "vararg" }]

# 5.1 file:lines takes no formats; they arrived in 5.2.
[shapes.file.members.lines]
kind = "function"
is_method = true
is_must_use = true

# 5.1 file:write returns nothing; the chainable file return is 5.2+.
[shapes.file.members.write]
kind = "function"
is_method = true
params = [{ kind = "vararg" }]

[shapes.file.members.seek]
kind = "function"
is_method = true
params = [
  { kind = "constant", values = ["set", "cur", "end"], is_required = false },
  { kind = "number", is_required = false },
]

[shapes.file.members.setvbuf]
kind = "function"
is_method = true
params = [
  { kind = "constant", values = ["no", "full", "line"] },
  { kind = "number", is_required = false },
]

[shapes.file.members.close]
kind = "function"
is_method = true

[shapes.file.members.flush]
kind = "function"
is_method = true

