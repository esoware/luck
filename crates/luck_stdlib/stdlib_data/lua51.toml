# Lua 5.1 standard library, verified against the 5.1 reference manual
# (https://www.lua.org/manual/5.1/), plus the undocumented newproxy.
# Entries that 5.1 already replaces, such as gcinfo and table.getn, are
# marked deprecated.
#
# A std definition, in the format the luck_stdlib README describes, which
# `just stdlib` generates the built-in catalog from. tests/it/drift.rs
# keeps the files consistent.

[globals._G]
kind = "property"
is_read_only = false

[globals._VERSION]
kind = "property"

# Interactive-interpreter prompt overrides (manual section 6).
[globals._PROMPT]
kind = "property"
is_read_only = false

[globals._PROMPT2]
kind = "property"
is_read_only = false

[globals.assert]
kind = "function"
params = [
  { kind = "any" },
  { kind = "string", is_required = false },
  { kind = "vararg" },
]

[globals.collectgarbage]
kind = "function"
params = [
  { kind = "constant", values = ["collect", "count", "restart", "setpause", "setstepmul", "step", "stop"], is_required = false },
  { kind = "number", is_required = false },
]

[globals.dofile]
kind = "function"
params = [{ kind = "string", is_required = false }]

[globals.error]
kind = "function"
params = [
  { kind = "any", is_required = false },
  { kind = "number", is_required = false },
]

# Already deprecated in 5.1 in favor of collectgarbage('count'); removed in 5.2.
[globals.gcinfo]
kind = "function"
is_must_use = true
# `gcinfo` counts whole kilobytes, and `collectgarbage('count')` a fraction too.
deprecated = { message = "use collectgarbage('count') instead", replacement = { template = "collectgarbage('count')", is_exact = false } }

[globals.getfenv]
kind = "function"
is_must_use = true
params = [{ kind = "any", is_required = false }]

[globals.getmetatable]
kind = "function"
is_must_use = true
params = [{ kind = "any" }]

[globals.ipairs]
kind = "function"
is_pure = true
is_must_use = true
params = [{ kind = "table" }]

[globals.load]
kind = "function"
params = [
  { kind = "function" },
  { kind = "string", is_required = false },
]

[globals.loadfile]
kind = "function"
params = [{ kind = "string", is_required = false }]

[globals.loadstring]
kind = "function"
params = [
  { kind = "string" },
  { kind = "string", is_required = false },
]

[globals.module]
kind = "function"
params = [
  { kind = "string" },
  { kind = "vararg" },
]

[globals.newproxy]
kind = "function"
is_must_use = true
params = [{ kind = "bool", is_required = false }]

[globals.next]
kind = "function"
params = [
  { kind = "table" },
  { kind = "any", is_required = false },
]

[globals.pairs]
kind = "function"
is_pure = true
is_must_use = true
params = [{ kind = "table" }]

[globals.pcall]
kind = "function"
is_must_use = true
params = [
  { kind = "function" },
  { kind = "vararg" },
]

[globals.print]
kind = "function"
params = [{ kind = "vararg" }]

[globals.rawequal]
kind = "function"
is_pure = true
is_must_use = true
params = [{ kind = "any" }, { kind = "any" }]

[globals.rawget]
kind = "function"
