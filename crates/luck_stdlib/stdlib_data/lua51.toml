is_must_use = true
params = [{ kind = "any" }, { kind = "any" }]

[globals.rawset]
kind = "function"
params = [{ kind = "any" }, { kind = "any" }, { kind = "any" }]

[globals.require]
kind = "function"
params = [{ kind = "string" }]

[globals.select]
kind = "function"
