# The Luau standard library: the globals of the open-source Luau VM and
# CLI (luau, luau-analyze). The Roblox library is this one with
# roblox_api.toml, roblox.toml, and roblox_enums.toml layered over it.
#
# A std definition, in the format the luck_stdlib README describes, which
# `just stdlib` generates the built-in catalogs from.

# ---- bare-word globals ----

[globals._G]
kind = "property"
is_read_only = false

[globals._VERSION]
kind = "property"

[globals.assert]
kind = "function"
params = [
  { kind = "any" },
  { kind = "string", is_required = false },
  { kind = "vararg" },
]

[globals.collectgarbage]
kind = "function"
params = [
  { kind = "constant", values = ["collect", "count"], is_required = false },
]

[globals.error]
kind = "function"
params = [
  { kind = "any", is_required = false },
  { kind = "number", is_required = false },
]

[globals.gcinfo]
kind = "function"
is_must_use = true

