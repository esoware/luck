# The Roblox environment, layered over luau.toml: what Roblox adds to the
# Luau libraries, the task library, its runtime globals and datatypes,
# and the entries it changes, which replace Luau's whole.
#
# A std definition, in the format the luck_stdlib README describes, which
# `just stdlib` layers over luau.toml and the generated roblox_api.toml,
# whose constant sets its params name, and under the generated
# roblox_enums.toml.

# ---- bare-word globals ----

# Roblox only supports the "count" operation; gcinfo() is the supported
# equivalent.
[globals.collectgarbage]
kind = "function"
is_must_use = true
# `gcinfo` counts whole kilobytes, and `collectgarbage('count')` a fraction too.
deprecated = { message = "deprecated on Roblox; use gcinfo() instead", replacement = { template = "gcinfo()", is_exact = false } }
params = [
  { kind = "constant", values = ["count"], is_required = false },
]

# Roblox deprecates both: touching an environment turns off Luau
# optimizations for the affected functions.
[globals.getfenv]
kind = "function"
is_must_use = true
deprecated = { message = "deprecated on Roblox; environment manipulation disables Luau optimizations" }
params = [{ kind = "any", is_required = false }]

[globals.setfenv]
kind = "function"
deprecated = { message = "deprecated on Roblox; environment manipulation disables Luau optimizations" }
params = [{ kind = "any" }, { kind = "table" }]

# A Roblox runtime addition; the open-source Luau VM doesn't register
# warn in base_funcs.
[globals.warn]
kind = "function"
params = [{ kind = "vararg" }]

# ---- utf8 namespace ----

[globals.utf8]
kind = "namespace"

# Roblox runtime addition; not part of the open-source Luau utf8 library.
[globals.utf8.members.graphemes]
kind = "function"
is_must_use = true
params = [
  { kind = "string" },
  { kind = "number", is_required = false },
  { kind = "number", is_required = false },
]

# Roblox runtime additions; not part of the open-source Luau utf8 library.
[globals.utf8.members.nfcnormalize]
kind = "function"
is_must_use = true
params = [{ kind = "string" }]

[globals.utf8.members.nfdnormalize]
kind = "function"
is_must_use = true
params = [{ kind = "string" }]

# ---- debug namespace ----

[globals.debug]
kind = "namespace"

# Every debug function but info and traceback is a Roblox runtime
# addition (MicroProfiler and memory tooling).
[globals.debug.members.dumpcodesize]
kind = "function"

[globals.debug.members.getmemorycategory]
kind = "function"
is_must_use = true

[globals.debug.members.profilebegin]
kind = "function"
params = [{ kind = "string" }]

[globals.debug.members.profileend]
kind = "function"

[globals.debug.members.resetmemorycategory]
kind = "function"

[globals.debug.members.setmemorycategory]
kind = "function"
params = [{ kind = "string" }]

# ---- vector namespace ----

[globals.vector]
kind = "namespace"

# Roblox vectors are 3-wide.
[globals.vector.members.create]
kind = "function"
is_pure = true
is_must_use = true
params = [{ kind = "number" }, { kind = "number" }, { kind = "number" }]

# ---- task (Roblox scheduler; not in the standard Luau VM) ----

[globals.task]
kind = "namespace"

[globals.task.members.cancel]
kind = "function"
params = [{ kind = "display", display = "thread" }]

[globals.task.members.defer]
kind = "function"
params = [
  { kind = "any" },
  { kind = "vararg" },
]

[globals.task.members.delay]
kind = "function"
params = [
  { kind = "number" },
  { kind = "any" },
  { kind = "vararg" },
]

[globals.task.members.desynchronize]
kind = "function"

[globals.task.members.spawn]
kind = "function"
params = [
  { kind = "any" },
  { kind = "vararg" },
]

[globals.task.members.synchronize]
kind = "function"

[globals.task.members.wait]
kind = "function"
params = [{ kind = "number", is_required = false }]

# ---- Roblox runtime globals (DataModel + scheduler legacy) ----
# The standalone Luau VM has none of these.

[globals.game]
kind = "property"
shape = "DataModel"

[globals.workspace]
kind = "property"
shape = "Workspace"

[globals.script]
kind = "property"
shape = "Instance"

[globals.plugin]
kind = "property"

[globals.shared]
kind = "property"
is_read_only = false

# The enum types and items come from the generated roblox_enums.toml,
# whose `enums` are members of this namespace.
[globals.Enum]
kind = "namespace"
shape = "Enums"

[globals.tick]
kind = "function"
is_must_use = true
deprecated = { message = "use os.clock() for benchmarking, or time()/DateTime.now() for wall-clock time" }

[globals.time]
kind = "function"
is_must_use = true

[globals.elapsedTime]
kind = "function"
is_must_use = true
# `time` counts from the start of the game, and `elapsedTime` from the start of the process.
deprecated = { message = "use time() instead", replacement = { template = "time()", is_exact = false } }

[globals.settings]
kind = "function"
is_must_use = true
returns = "GlobalSettings"

[globals.version]
kind = "function"
is_must_use = true
deprecated = { message = "deprecated on Roblox" }

[globals.UserSettings]
kind = "function"
is_must_use = true
returns = "UserSettings"

# Plugin/Studio context only, but registered as a global everywhere.
[globals.PluginManager]
kind = "function"
is_must_use = true

[globals.stats]
kind = "function"
is_must_use = true
deprecated = { message = "use game:GetService(\"Stats\") instead", replacement = { template = "game:GetService(\"Stats\")", is_exact = true } }

[globals.printidentity]
kind = "function"
deprecated = { message = "deprecated on Roblox; identity levels are not observable from scripts" }
params = [{ kind = "string", is_required = false }]

[globals.DebuggerManager]
kind = "function"
is_must_use = true
deprecated = { message = "deprecated on Roblox" }

[globals.ypcall]
kind = "function"
is_must_use = true
deprecated = { message = "pcall has supported yielding since 2014; use it directly", replacement = { template = "pcall(%1)", is_exact = true } }
params = [
  { kind = "function" },
  { kind = "vararg" },
]

# Legacy global scheduler functions; deprecated in favor of task.*.

[globals.wait]
kind = "function"
params = [{ kind = "number", is_required = false }]
# `wait` resumes on the throttled legacy scheduler, and `task.wait` on the next step.
deprecated = { message = "use task.wait", replacement = { template = "task.wait(%1)", is_exact = false } }

[globals.spawn]
kind = "function"
params = [
  { kind = "any" },
  { kind = "vararg" },
]
# `spawn` defers the call to the legacy scheduler, and `task.spawn` makes it at once.
deprecated = { message = "use task.spawn", replacement = { template = "task.spawn(%1)", is_exact = false } }

[globals.delay]
kind = "function"
params = [
  { kind = "number" },
  { kind = "any" },
  { kind = "vararg" },
]
# `delay` waits on the throttled legacy scheduler, and `task.delay` doesn't.
deprecated = { message = "use task.delay", replacement = { template = "task.delay(%1, %2)", is_exact = false } }

