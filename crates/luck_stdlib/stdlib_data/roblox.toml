# ---- value shapes ----
# Instance holds the commonly used methods every Roblox instance has. Events
# and per-class properties would need the full class hierarchy, which
# this model doesn't carry. Name and Parent are the only properties,
# since every instance has them and the script.Parent idiom needs Parent.

[shapes.Instance.members.Name]
kind = "property"
is_read_only = false

[shapes.Instance.members.Parent]
kind = "property"
is_read_only = false
shape = "Instance"

[shapes.Instance.members.Clone]
kind = "function"
is_method = true
is_must_use = true
returns = "Instance"

[shapes.Instance.members.Destroy]
kind = "function"
is_method = true

[shapes.Instance.members.FindFirstAncestor]
kind = "function"
is_method = true
is_must_use = true
params = [{ kind = "string" }]
returns = "Instance"

# OfClass and WhichIsA both take roblox_all_classes. The dump doesn't
# mark abstract classes, so a narrower set for the exact-class lookups
# could reject valid concrete names.
[shapes.Instance.members.FindFirstAncestorOfClass]
kind = "function"
is_method = true
is_must_use = true
params = [{ kind = "constant", set = "roblox_all_classes" }]
returns = "Instance"

[shapes.Instance.members.FindFirstAncestorWhichIsA]
kind = "function"
is_method = true
is_must_use = true
params = [{ kind = "constant", set = "roblox_all_classes" }]
returns = "Instance"

[shapes.Instance.members.FindFirstChild]
kind = "function"
is_method = true
is_must_use = true
params = [
  { kind = "string" },
  { kind = "bool", is_required = false },
]
returns = "Instance"

[shapes.Instance.members.FindFirstChildOfClass]
kind = "function"
is_method = true
is_must_use = true
params = [{ kind = "constant", set = "roblox_all_classes" }]
returns = "Instance"

[shapes.Instance.members.FindFirstChildWhichIsA]
kind = "function"
is_method = true
is_must_use = true
params = [
  { kind = "constant", set = "roblox_all_classes" },
  { kind = "bool", is_required = false },
]
returns = "Instance"

[shapes.Instance.members.GetAttribute]
kind = "function"
is_method = true
is_must_use = true
params = [{ kind = "string" }]

[shapes.Instance.members.GetAttributes]
kind = "function"
is_method = true
is_must_use = true

[shapes.Instance.members.GetChildren]
kind = "function"
is_method = true
is_must_use = true

[shapes.Instance.members.GetDescendants]
kind = "function"
is_method = true
is_must_use = true

[shapes.Instance.members.GetFullName]
kind = "function"
is_method = true
is_must_use = true

[shapes.Instance.members.IsA]
kind = "function"
is_method = true
is_must_use = true
params = [{ kind = "constant", set = "roblox_all_classes" }]

[shapes.Instance.members.IsAncestorOf]
kind = "function"
is_method = true
is_must_use = true
params = [{ kind = "display", display = "Instance" }]

[shapes.Instance.members.IsDescendantOf]
kind = "function"
is_method = true
is_must_use = true
params = [{ kind = "display", display = "Instance" }]

[shapes.Instance.members.SetAttribute]
kind = "function"
is_method = true
params = [{ kind = "string" }, { kind = "any" }]

[shapes.Instance.members.WaitForChild]
kind = "function"
is_method = true
is_must_use = true
