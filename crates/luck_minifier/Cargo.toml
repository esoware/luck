[package]
name                   = "luck_minifier"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
description            = "Lua and Luau minifier with constant folding, dead-code removal, and variable renaming"
edition.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[features]
# Derive `Deserialize` for `TransformConfig`, the shape `luck.json` gives it.
serde = ["dep:serde"]
# Derive `JsonSchema` too, for the schema `luck_config` generates.
schemars = ["dep:schemars", "serde"]

[lints]
workspace = true

[dependencies]
luck_allocator       = { workspace = true }
luck_ast             = { workspace = true }
luck_codegen         = { workspace = true }
luck_data_structures = { workspace = true }
luck_diagnostics     = { workspace = true }
luck_parser          = { workspace = true }
luck_semantic        = { workspace = true }
luck_token           = { workspace = true }
luck_value           = { workspace = true }

rustc-hash = { workspace = true }
schemars   = { workspace = true, optional = true }
serde      = { workspace = true, optional = true }

[dev-dependencies]
luck_testgen = { workspace = true }
