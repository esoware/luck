[package]
name                   = "luck_core"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
description            = "Dialect targets shared across the luck toolchain"
edition.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[features]
# Derive `Deserialize` for `LuaTarget`, the shape `luck.json` gives it.
serde = ["dep:serde"]
# Derive `JsonSchema` too, for the schema `luck_config` generates.
schemars = ["dep:schemars", "serde"]

[lints]
workspace = true

[dependencies]
luck_token = { workspace = true }

schemars = { workspace = true, optional = true }
serde    = { workspace = true, optional = true }

[dev-dependencies]
# The tests read dialects as `luck.json` spells them.
luck_core = { path = ".", features = ["serde"] }
