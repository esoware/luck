[package]
name                   = "luck_allocs"
version.workspace      = true
publish                = false
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
description            = "Internal tool: committed allocation counts for each pipeline stage over the benchmark files"

[lints]
workspace = true

[[bin]]
name    = "luck_allocs"
test    = false
doctest = false

[dependencies]
luck_allocator       = { workspace = true, features = ["track_allocations"] }
luck_ast             = { workspace = true }
luck_benchmark_files = { workspace = true }
luck_codegen         = { workspace = true }
luck_formatter       = { workspace = true }
luck_lexer           = { workspace = true }
luck_linter          = { workspace = true }
luck_minifier        = { workspace = true }
luck_parser          = { workspace = true }
luck_semantic        = { workspace = true }

humansize     = { workspace = true }
mimalloc-safe = { workspace = true }
saphyr        = { workspace = true }
