[package]
name                   = "luck_bundler"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
description            = "Dependency-graph bundler for multi-file Lua and Luau projects"
edition.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[features]
# Derive `Deserialize` for `DynamicRequire`, the shape `luck.json` gives it.
serde = ["dep:serde"]
# Derive `JsonSchema` too, for the schema `luck_config` generates.
schemars = ["dep:schemars", "serde"]

[lints]
workspace = true

[dependencies]
luck_allocator = { workspace = true }
luck_ast       = { workspace = true }
luck_core      = { workspace = true }
luck_lexer     = { workspace = true }
luck_minifier  = { workspace = true }
luck_parser    = { workspace = true }
luck_resolver  = { workspace = true }
luck_semantic  = { workspace = true }
luck_token     = { workspace = true }

petgraph   = { workspace = true }
rayon      = { workspace = true }
rustc-hash = { workspace = true }
schemars   = { workspace = true, optional = true }
serde      = { workspace = true, optional = true }

[dev-dependencies]
luck_testgen = { workspace = true }

insta    = { workspace = true }
tempfile = { workspace = true }
