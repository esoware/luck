# Lua 5.5 standard library, verified against the 5.5 reference manual
# (https://www.lua.org/manual/5.5/). Notable vs 5.4:
#   - table.create added; math.frexp and math.ldexp standard again
#   - collectgarbage reworked: setpause/setstepmul gone, tuning goes
#     through the "param" option; incremental/generational take no
#     extra arguments
#   - named varargs and the `global` keyword are parser-level, not
#     stdlib

[globals._G]
kind = "property"
is_read_only = false

[globals._VERSION]
kind = "property"

# Interactive-interpreter prompt overrides (manual section 7).
[globals._PROMPT]
kind = "property"
is_read_only = false

[globals._PROMPT2]
kind = "property"
is_read_only = false

[globals.assert]
kind = "function"
min_args = 1
max_args = -1
params = [
  { kind = "any" },
  { kind = "string", is_required = false },
  { kind = "vararg", is_required = false },
]

# 5.5 drops 'setpause'/'setstepmul', and 'incremental'/'generational' no
# longer take tuning arguments. Tuning goes through 'param' with a
# parameter name and an optional new value.
[globals.collectgarbage]
kind = "function"
overloads = [
  { min_args = 0, max_args = 1, params = [
    { kind = "constant", values = ["collect", "count", "generational", "incremental", "isrunning", "restart", "stop"], is_required = false },
  ] },
  { min_args = 1, max_args = 2, params = [
    { kind = "constant", values = ["step"] },
    { kind = "number", is_required = false },
  ] },
  { min_args = 2, max_args = 3, params = [
    { kind = "constant", values = ["param"] },
    { kind = "constant", values = ["majorminor", "minormajor", "minormul", "pause", "stepmul", "stepsize"] },
    { kind = "number", is_required = false },
  ] },
]

[globals.dofile]
kind = "function"
min_args = 0
max_args = 1
params = [{ kind = "string", is_required = false }]

