[package]
name                   = "luck_linter"
version.workspace      = true
authors.workspace      = true
categories.workspace   = true
description            = "Lua and Luau linter with scope-aware analysis and autofix"
edition.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[features]
# Derive `Deserialize` and `Serialize` for `LintConfig`, the shape `luck.json` gives it.
serde = ["dep:serde"]
# Derive `JsonSchema` too, for the schema `luck_config` generates.
schemars = ["dep:schemars", "serde"]

[lints]
workspace = true

[dependencies]
luck_allocator   = { workspace = true }
luck_ast         = { workspace = true }
luck_core        = { workspace = true }
luck_diagnostics = { workspace = true }
luck_parser      = { workspace = true }
luck_semantic    = { workspace = true }
luck_token       = { workspace = true }

bitflags   = { workspace = true }
memchr     = { workspace = true }
rayon      = { workspace = true }
rustc-hash = { workspace = true }
schemars   = { workspace = true, optional = true }
serde      = { workspace = true, optional = true }

[dev-dependencies]
# The tests write configs as `luck.json` text.
luck_linter  = { path = ".", features = ["serde"] }
luck_testgen = { workspace = true }

serde_json = { workspace = true }
