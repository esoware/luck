[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Hybrid CRT: the VC runtime stays static, but the UCRT links dynamically to
# the system's ucrtbase.dll, so every linked library shares one C runtime.
[target.'cfg(target_os = "windows")']
rustflags = [
  "-C",
  "link-args=/NODEFAULTLIB:libucrt.lib",
  "-C",
  "link-args=/DEFAULTLIB:ucrt.lib",
]
